<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>VideyHub Landing Page</title>

  <!-- WAJIB untuk HP -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO dasar -->
  <meta name="description" content="Halaman landing VideyHub, redirect aman dengan tampilan menarik.">
  <meta name="robots" content="index, follow">

  <style>
    body {
      background: #ffffff;
      margin: 0;
      padding-bottom: 200px;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    @keyframes BackgroundGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .VCE {
      color: #f2f2f2;
      background: linear-gradient(
        45deg,
        #FCE38A,
        #f5ad4d,
        #fd81b5,
        #f74689,
        #ad5af3,
        #8a13ef
      );
      background-size: 450% 100%;
      animation: BackgroundGradient 30s ease infinite;
      padding: 25px;
      margin: 20px;
      border-radius: 15px;
    }

    .VCE_Title {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .JTime {
      font-size: 18px;
      margin: 10px 0;
    }

    button {
      font-size: 16px;
      padding: 15px 22px;
      border: 3px solid #f2f2f2;
      border-radius: 20px;
      background: transparent;
      color: #ffffff;
      cursor: pointer;
    }

    button:hover {
      background: rgba(255,255,255,0.2);
    }
  </style>
</head>

<body>

  <div class="VCE">
    <h2 class="VCE_Title">VideyHub Landing Page</h2>
    <hr style="border: 3px solid #f2f2f2;">

    <p class="JTime">Klik tombol untuk menampilkan waktu</p>

    <button onclick="document.getElementById('Example').innerHTML = new Date().toString()">
      Tampilkan Tanggal & Waktu
    </button>

    <p class="JTime" id="Example"></p>

    <p class="JTime">
      Halaman ini sudah <b>100% siap GitHub Pages</b>
    </p>
  </div>

</body>
</html>
