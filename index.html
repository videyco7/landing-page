<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: black;
  overflow: hidden;
}

video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Loader buffer ala video */
.loader {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background:
    conic-gradient(white 0deg, rgba(255,255,255,0.2) 0deg);
  mask: radial-gradient(circle 60%, transparent 61%);
  z-index: 10;
}

/* Tombol */
.button {
  display: none;
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  background: #ff2d2d;
  color: #fff;
  padding: 14px 36px;
  border-radius: 30px;
  font-size: 18px;
  text-decoration: none;
  z-index: 10;
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
  <source src="https://res.cloudinary.com/db7ydvohy/video/upload/bigo_bigolive_rmhff9.mp4" type="video/mp4">
</video>

<div class="loader" id="loader"></div>

<a href="https://www.effectivegatecpm.com/b29fkyqsa?key=da2a5b7f16814d1431018f8c5701a9a2"
   class="button" id="btn" target="_blank" rel="noopener">
  Lanjutkan
</a>

<script>
let deg = 0;
let loader = document.getElementById('loader');

let interval = setInterval(() => {
  deg += 360 / 50; // 5 detik
  loader.style.background =
    `conic-gradient(white ${deg}deg, rgba(255,255,255,0.2) ${deg}deg)`;
}, 100);

setTimeout(() => {
  clearInterval(interval);
  loader.style.display = "none";
  document.getElementById('btn').style.display = "block";
}, 5000);
</script>

</body>
</html>
